<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocHelper App</title>
  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      color: #1e293b;
    }
    .container {
      width: 90%;
      max-width: 400px;
      text-align: center;
      padding: 24px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    h1 { margin-bottom: 8px; font-size: 24px; }
    p { margin-bottom: 24px; color: #64748b; }
    .btn {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-pay { background-color: #334155; color: white; }
    .btn-payout { background-color: #15803d; color: white; }
  </style>
</head>
<body>

  <div class="container">
    <h1>DocHelper App</h1>
    <p>Pi Testnet Verification</p>

    <!-- Trigger Buttons -->
    <button class="btn btn-pay" onclick="payUserToApp()">1. Pay 0.1 Pi (Registers User)</button>
    <button class="btn btn-payout" onclick="requestPayout()">2. Receive 0.1 Test Pi (Payout)</button>
  </div>

  <script>
    let currentUserUID = null;

    // Initialize Pi SDK for Sandbox / Testnet
    Pi.init({ version: "2.0", sandbox: true });

    const scopes = ['payments', 'username'];
    function onIncompletePaymentFound(payment) {
      fetch('/api/complete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ paymentId: payment.identifier, txid: payment.transaction.txid })
      });
    }

    // Authenticate Pioneer
    Pi.authenticate(scopes, onIncompletePaymentFound).then(function(auth) {
      currentUserUID = auth.user.uid;
      console.log("Authenticated UID:", currentUserUID);
    }).catch(function(error) {
      console.error("Authentication failed:", error);
    });

    // 1. User-to-App Payment Handler
    async function payUserToApp() {
      try {
        const paymentData = {
          amount: 0.1,
          memo: "DocHelper Test Payment",
          metadata: { purpose: "testnet_verification" }
        };

        const callbacks = {
          onReadyForServerApproval: async function(paymentId) {
            const res = await fetch('/api/approve', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ paymentId: paymentId })
            });
            await res.json();
          },
          onReadyForServerCompletion: async function(paymentId, txid) {
            const res = await fetch('/api/complete', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ paymentId: paymentId, txid: txid })
            });
            await res.json();
            alert("Payment successful! TxID: " + txid);
          },
          onCancel: function(paymentId) {
            alert("Payment cancelled: " + paymentId);
          },
          onError: function(error, payment) {
            alert("Payment error: " + (error.message || JSON.stringify(error)));
          }
        };

        await Pi.createPayment(paymentData, callbacks);
      } catch (err) {
        alert("Payment creation error: " + err.message);
      }
    }

    // 2. App-to-User Payout Handler
    async function requestPayout() {
      if (!currentUserUID) {
        alert("Please tap '1. Pay 0.1 Pi' first to authenticate.");
        return;
      }

      try {
        const response = await fetch('/api/payout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uid: currentUserUID })
        });

        const data = await response.json();
        if (response.ok && data.success) {
          alert("Success! Payout ID: " + data.paymentId);
        } else {
          alert("Payout error: " + (data.error || JSON.stringify(data)));
        }
      } catch (err) {
        alert("Network error: " + err.message);
      }
    }
  </script>
</body>
</html>
