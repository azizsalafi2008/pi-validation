<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocHelper App</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 20px;
      background-color: #f4f4f9;
      margin: 0;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }
    p {
      color: #555;
      margin-bottom: 30px;
    }
    button {
      background-color: #006644;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.1rem;
      border-radius: 8px;
      cursor: pointer;
    }
    button:active {
      background-color: #004d33;
    }
  </style>
</head>
<body>

  <h1>DocHelper App</h1>
  <p>App is running successfully on Pi Testnet!</p>

  <button onclick="requestPayout()">Receive 0.1 Test Pi</button>

  <script>
    // Initialize Pi SDK for Testnet
    Pi.init({ version: "2.0", sandbox: true });

    async function requestPayout() {
      try {
        // Authenticate user to get verified UID
        const auth = await Pi.authenticate(['username', 'payments'], onIncompletePaymentFound);
        
        if (!auth || !auth.user || !auth.user.uid) {
          alert('Authentication failed: Could not retrieve Pi User UID.');
          return;
        }

        const response = await fetch('/api/payout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uid: auth.user.uid, amount: 0.1 })
        });

        const data = await response.json();

        if (!response.ok) {
          alert('Payout error: ' + JSON.stringify(data));
        } else {
          alert('Success! Payout created. ID: ' + (data.identifier || data.payment?.identifier || 'OK'));
        }
      } catch (err) {
        alert('SDK Error: ' + err.message);
      }
    }

    function onIncompletePaymentFound(payment) {
      console.log('Incomplete payment:', payment);
    }
  </script>

</body>
</html>
