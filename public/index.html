<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocHelper App</title>
  <!-- Load Pi Network SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 20px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }
    p {
      color: #555;
      margin-bottom: 30px;
    }
    button {
      background-color: #006644;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>DocHelper App</h1>
  <p>App is running successfully on Pi Testnet!</p>

  <button onclick="requestPayout()">Receive 0.1 Test Pi</button>

  <script>
    // Initialize Pi SDK in Sandbox/Testnet Mode
    Pi.init({ version: "2.0", sandbox: true });

    async function requestPayout() {
      try {
        const auth = await Pi.authenticate(['username', 'payments'], onIncompletePaymentFound);
        const userUid = auth.user.uid;

        if (!userUid) {
          alert('Failed to retrieve user UID from Pi SDK.');
          return;
        }

        const response = await fetch('/api/payout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uid: userUid, amount: 0.1 })
        });

        const data = await response.json();

        if (!response.ok) {
          alert('Payout failed: ' + (data.error || JSON.stringify(data)));
        } else {
          alert('Payout successful! Transaction ID: ' + (data.identifier || data.payment?.identifier));
        }
      } catch (err) {
        alert('Error during payout request: ' + err.message);
      }
    }

    function onIncompletePaymentFound(payment) {
      console.log('Incomplete payment found:', payment);
    }
  </script>
</body>
</html>
