<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocHelper App</title>
  <!-- Pi Network SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f1f5f9;
      color: #0f172a;
    }
    .card {
      width: 90%;
      max-width: 420px;
      padding: 30px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 { margin-top: 0; font-size: 24px; color: #1e293b; }
    p { margin-bottom: 24px; color: #64748b; font-size: 14px; }
    .btn {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.8; }
    .btn-pay { background-color: #334155; color: #ffffff; }
    .btn-payout { background-color: #16a34a; color: #ffffff; }
    .status { margin-top: 15px; font-size: 13px; color: #64748b; word-break: break-all; }
  </style>
</head>
<body>

  <div class="card">
    <h1>DocHelper App</h1>
    <p>Pi Testnet Verification</p>

    <button class="btn btn-pay" onclick="payUserToApp()">1. Pay 0.1 Pi (Registers User)</button>
    <button class="btn btn-payout" onclick="requestPayout()">2. Receive 0.1 Test Pi (Payout)</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    let currentUserUID = null;

    // 1. Initialize Pi SDK in Sandbox/Testnet Mode
    Pi.init({ version: "2.0", sandbox: true });

    const scopes = ['payments', 'username'];

    function onIncompletePaymentFound(payment) {
      fetch('/api/complete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ paymentId: payment.identifier, txid: payment.transaction.txid })
      });
    }

    // Authenticate user on load
    Pi.authenticate(scopes, onIncompletePaymentFound).then(function(auth) {
      currentUserUID = auth.user.uid;
      document.getElementById('status').innerText = "Authenticated as UID: " + currentUserUID;
    }).catch(function(error) {
      console.error("Auth error:", error);
      document.getElementById('status').innerText = "Authentication pending or failed.";
    });

    // 2. User-to-App Payment Flow (Button 1)
    async function payUserToApp() {
      try {
        const paymentData = {
          amount: 0.1,
          memo: "DocHelper Test Payment",
          metadata: { purpose: "testnet_verification" }
        };

        const callbacks = {
          onReadyForServerApproval: async function(paymentId) {
            document.getElementById('status').innerText = "Approving payment...";
            await fetch('/api/approve', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ paymentId: paymentId })
            });
          },
          onReadyForServerCompletion: async function(paymentId, txid) {
            document.getElementById('status').innerText = "Completing payment...";
            await fetch('/api/complete', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ paymentId: paymentId, txid: txid })
            });
            alert("Payment successful! TxID: " + txid);
            document.getElementById('status').innerText = "Payment settled on-chain!";
          },
          onCancel: function(paymentId) {
            alert("Payment cancelled: " + paymentId);
            document.getElementById('status').innerText = "Payment cancelled.";
          },
          onError: function(error, payment) {
            alert("Payment failed: " + (error.message || JSON.stringify(error)));
            document.getElementById('status').innerText = "Payment error occurred.";
          }
        };

        await Pi.createPayment(paymentData, callbacks);
      } catch (err) {
        alert("Error initiating payment: " + err.message);
      }
    }

    // 3. App-to-User Payout Flow (Button 2)
    async function requestPayout() {
      if (!currentUserUID) {
        alert("Please tap '1. Pay 0.1 Pi' first to authenticate.");
        return;
      }

      document.getElementById('status').innerText = "Processing payout...";

      try {
        const response = await fetch('/api/payout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uid: currentUserUID })
        });

        const data = await response.json();
        if (response.ok && data.success) {
          alert("Success! Payout ID: " + data.paymentId);
          document.getElementById('status').innerText = "Payout complete: " + data.paymentId;
        } else {
          alert("Payout error: " + (data.error || JSON.stringify(data)));
          document.getElementById('status').innerText = "Payout failed.";
        }
      } catch (err) {
        alert("Network error: " + err.message);
        document.getElementById('status').innerText = "Network error.";
      }
    }
  </script>
</body>
</html>
