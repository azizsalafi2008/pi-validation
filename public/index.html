<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocHelper App</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 50px 20px;
      background-color: #f8f9fa;
      color: #333;
    }
    h1 { font-size: 32px; margin-bottom: 10px; }
    p { font-size: 18px; color: #666; margin-bottom: 30px; }
    button {
      background-color: #006644;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    button:active { background-color: #004d33; }
  </style>
</head>
<body>

  <h1>DocHelper App</h1>
  <p>Pi Testnet Verification</p>

  <button onclick="requestPayout()">Receive 0.1 Test Pi</button>

  <script>
    // Initialize Pi SDK for Testnet Sandbox
    Pi.init({ version: "2.0", sandbox: true });

    function onIncompletePaymentFound(payment) {
      console.log("Incomplete payment found:", payment);
    }

    async function requestPayout() {
      try {
        // Authenticate user with scopes required for App-to-User payouts
        const auth = await Pi.authenticate(['username', 'payments'], onIncompletePaymentFound);
        
        if (!auth || !auth.user || !auth.user.uid) {
          alert("Could not retrieve user authentication details.");
          return;
        }

        // Send authenticated UID to payout endpoint
        const response = await fetch('/api/payout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uid: auth.user.uid, amount: 0.1 })
        });

        const data = await response.json();

        if (!response.ok) {
          alert("Payout error: " + (data.error || data.message || JSON.stringify(data)));
        } else {
          alert("Success! Payout created. Payment ID: " + (data.identifier || data.payment?.identifier));
        }
      } catch (err) {
        alert("SDK Error: " + err.message);
      }
    }
  </script>

</body>
</html>
