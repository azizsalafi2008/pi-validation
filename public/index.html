<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocHelper App</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px 20px; background: #f8f9fa; }
    .btn { background: #006644; color: white; border: none; padding: 14px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin: 10px; width: 280px; }
    .btn-secondary { background: #4a5568; }
    .btn-danger { background: #c53030; }
  </style>
</head>
<body>

  <h1>DocHelper App</h1>
  <p>Pi Testnet Verification</p>

  <button class="btn btn-secondary" onclick="makeUserPayment()">1. Pay 0.1 Pi (Registers User)</button>
  <br>
  <button class="btn btn-danger" onclick="clearOngoingPayment()">Clear Stuck Payment</button>
  <br>
  <button class="btn" onclick="requestPayout()">2. Receive 0.1 Test Pi (Payout)</button>

  <script>
    Pi.init({ version: "2.0", sandbox: false });

    const scopes = ['username', 'payments', 'wallet_address'];

    async function onIncompletePaymentFound(payment) {
      if (payment && payment.identifier) {
        await fetch('/api/cancel', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paymentId: payment.identifier })
        });
      }
    }

async function clearOngoingPayment() {
      try {
        const res = await fetch('/api/cancel', { method: 'POST' });
        const data = await res.json();
        alert("Server cleanup response: " + JSON.stringify(data));
      } catch (err) {
        alert("Clear error: " + err.message);
      }
    }

    async function makeUserPayment() {
      try {
        const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
        Pi.createPayment({
          amount: 0.1,
          memo: "Register User UID for Payouts",
          metadata: { type: "registration" }
        }, {
          onReadyForServerApproval: async (id) => {
            await fetch('/api/approve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ paymentId: id }) });
          },
          onReadyForServerCompletion: async (id, txid) => {
            await fetch('/api/complete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ paymentId: id, txid: txid }) });
            alert("Payment completed!");
          },
          onCancel: () => { alert("Cancelled"); },
          onError: (err) => { alert("Error: " + err.message); }
        });
      } catch (err) {
        alert("Auth error: " + err.message);
      }
    }

    async function requestPayout() {
      try {
        const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
        if (!auth || !auth.user || !auth.user.uid) {
          alert("Could not retrieve user UID.");
          return;
        }

        const res = await fetch('/api/payout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uid: auth.user.uid, amount: 0.1 })
        });

        const data = await res.json();
        if (!res.ok) {
          alert("Payout error: " + (data.error || data.message || JSON.stringify(data)));
        } else {
          alert("Success! Payout ID: " + (data.paymentId || data.identifier || JSON.stringify(data)));
        }
      } catch (err) {
        alert("SDK Error: " + err.message);
      }
    }
  </script>

</body>
</html>
