<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocHelper</title>

  <!-- Load Pi SDK First -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
  <h1>DocHelper App</h1>
  <p>App is running successfully on Pi Testnet!</p>

  <script>
    // Initialize Pi SDK safely
    if (typeof Pi !== 'undefined') {
      Pi.init({ version: "2.0", sandbox: true });
      console.log("Pi SDK initialized in Testnet mode!");
    } else {
      console.log("Not running inside Pi Browser environment.");
    }
  </script>
</body>
</html>
