<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>
  // Initialize Pi SDK
  Pi.init({ version: "2.0", sandbox: true });

  function onIncompletePaymentFound(payment) {
    console.log("Incomplete payment found:", payment);
  }

  async function requestPayout() {
    try {
      // Authenticate with explicit payments scope
      const auth = await Pi.authenticate(['username', 'payments'], onIncompletePaymentFound);
      
      if (!auth || !auth.user || !auth.user.uid) {
        alert("Could not retrieve user UID.");
        return;
      }

      // Send payment request to serverless backend
      const response = await fetch('/api/payout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uid: auth.user.uid, amount: 0.1 })
      });

      const data = await response.json();

      if (!response.ok) {
        alert("Payout error: " + (data.error || JSON.stringify(data)));
      } else {
        alert("Success! Payout created. Payment ID: " + (data.identifier || data.payment?.identifier));
      }
    } catch (err) {
      alert("SDK Error: " + err.message);
    }
  }
</script>
