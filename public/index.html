<script>
async function requestPayout() {
  try {
    // 1. Authenticate user to get their actual Pi UID
    const auth = await Pi.authenticate(['username', 'payments'], onIncompletePaymentFound);
    const userUid = auth.user.uid;

    if (!userUid) {
      alert('Failed to fetch Pi User UID.');
      return;
    }

    // 2. Call payout endpoint with authenticated UID
    const response = await fetch('/api/payout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uid: userUid, amount: 0.1 })
    });

    const data = await response.json();

    if (!response.ok) {
      alert('Payout failed: ' + (data.error || JSON.stringify(data)));
    } else {
      alert('Payout initiated successfully! Payment ID: ' + (data.identifier || data.payment?.identifier));
    }
  } catch (err) {
    alert('Authentication error: ' + err.message);
  }
}

function onIncompletePaymentFound(payment) {
  console.log('Incomplete payment found:', payment);
}
</script>
