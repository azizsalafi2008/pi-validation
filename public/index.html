<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocHelper App</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 40px 20px; }
    button { background-color: #673ab7; color: white; border: none; padding: 15px 30px; font-size: 16px; border-radius: 8px; cursor: pointer; }
    #status { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>DocHelper App</h1>
  <p>App is running successfully on Pi Testnet!</p>
  
  <button id="pay-btn" onclick="makeTestPayment()">Pay 1 Test Pi</button>
  <div id="status"></div>

  <script>
    if (typeof Pi !== 'undefined') {
      Pi.init({ version: "2.0", sandbox: true });
    }

    function makeTestPayment() {
      const statusDiv = document.getElementById('status');
      statusDiv.innerText = "Authenticating...";

      function onIncompletePaymentFound(payment) {
        statusDiv.innerText = "Clearing stuck payment...";
        fetch('/api/approve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paymentId: payment.identifier })
        });
      }

      Pi.authenticate(['payments'], onIncompletePaymentFound).then(function(auth) {
        statusDiv.innerText = "Creating transaction...";

        Pi.createPayment({
          amount: 1,
          memo: "Step 10 Test Payment",
          metadata: { orderId: "test-123" }
        }, {
          onReadyForServerApproval: function(paymentId) {
            statusDiv.innerText = "Approving payment...";
            fetch('/api/approve', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ paymentId })
            }).then(() => statusDiv.innerText = "Approved! Confirm in wallet.");
          },
          onReadyForServerCompletion: function(paymentId, txid) {
            statusDiv.innerText = "Completing payment...";
            fetch('/api/complete', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ paymentId, txid })
            }).then(() => {
              statusDiv.innerText = "Transaction Complete! Step 10 Passed!";
              alert("Payment successful! Step 10 complete.");
            });
          },
          onCancel: function(paymentId) { statusDiv.innerText = "Payment cancelled."; },
          onError: function(error) { statusDiv.innerText = "Payment error: " + error.message; }
        });
      });
    }
  </script>
</body>
</html>
