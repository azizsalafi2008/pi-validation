<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocHelper</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
    <h1>DocHelper Application</h1>
    <button id="pay-btn" onclick="makePayment()" disabled>Pay with Pi</button>
    <p id="status">Authenticating with Pi Network...</p>

    <script>
        Pi.init({ version: "2.0", sandbox: true });

        // Include both 'username' and 'payments' scopes
        const scopes = ['username', 'payments'];

        function onIncompletePaymentFound(payment) {
            console.log("Incomplete payment found:", payment);
        }

        Pi.authenticate(scopes, onIncompletePaymentFound)
            .then(function(auth) {
                document.getElementById("status").innerText = "Connected as: " + auth.user.username;
                document.getElementById("pay-btn").disabled = false;
            })
            .catch(function(error) {
                console.error("Authentication failed:", error);
                document.getElementById("status").innerText = "Authentication failed. Reopen in Pi Browser.";
            });

        function makePayment() {
            Pi.createPayment({
                amount: 1,
                memo: "DocHelper Test Payment",
                metadata: { orderId: 1234 }
            }, {
                onReadyForServerApproval: function(paymentId) {
                    console.log("Ready for approval:", paymentId);
                    // Send approval request directly to Pi Sandbox API for client-side testing
                    fetch(`https://api.testnet.minepi.com/v2/payments/${paymentId}/approve`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    }).catch(err => console.log("Auto-approval sent or handled by portal."));
                },
                onReadyForServerCompletion: function(paymentId, txid) {
                    console.log("Ready for completion:", paymentId, txid);
                    fetch(`https://api.testnet.minepi.com/v2/payments/${paymentId}/complete`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ txid: txid })
                    }).catch(err => console.log("Completion sent."));
                },
                onCancel: function(paymentId) {
                    console.log("Cancelled:", paymentId);
                },
                onError: function(error, payment) {
                    console.error("Error:", error);
                }
            });
        }
    </script>
</body>
</html>
