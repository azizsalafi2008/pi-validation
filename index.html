<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocHelper</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
    <h1>DocHelper Application</h1>
    <button id="pay-btn" onclick="makePayment()">Pay with Pi</button>
    <div id="status" style="color: blue; margin-top: 15px; font-weight: bold;"></div>

    <script>
        // Initialize Pi SDK for Testnet
        Pi.init({ version: "2.0", sandbox: false });

        // Authenticate User & Auto-Resolve Incomplete Payments
        Pi.authenticate(['username', 'payments'], function(payment) {
            showLog("Resolving incomplete payment: " + payment.identifier);

            var txid = payment.transaction ? payment.transaction.txid : "";

            return fetch('/api/complete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    paymentId: payment.identifier, 
                    txid: txid 
                })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                showLog("Incomplete payment resolved: " + JSON.stringify(data));
            })
            .catch(function(err) {
                showLog("Error clearing payment: " + err.message);
            });
        }).then(function(auth) {
            showLog("Connected as: " + auth.user.username);
        }).catch(function(error) {
            showLog("Auth error: " + error.message);
        });

        function showLog(msg) {
            var statusDiv = document.getElementById("status");
            if (statusDiv) {
                statusDiv.innerText = msg;
            }
            console.log(msg);
        }

        function makePayment() {
            showLog("Creating payment...");

            Pi.createPayment({
                amount: 1,
                memo: "DocHelper Test Payment",
                metadata: { orderId: 1234 }
            }, {
                onReadyForServerApproval: function(paymentId) {
                    showLog("Approving payment ID: " + paymentId);
                    
                    return fetch('/api/approve', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ paymentId: paymentId })
                    })
                    .then(function(res) { return res.json(); })
                    .then(function(data) {
                        showLog("Approve response: " + JSON.stringify(data));
                    })
                    .catch(function(err) {
                        showLog("Approval fetch error: " + err.message);
                    });
                },
                onReadyForServerCompletion: function(paymentId, txid) {
                    showLog("Completing payment ID: " + paymentId);
                    
                    return fetch('/api/complete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ paymentId: paymentId, txid: txid })
                    })
                    .then(function(res) { return res.json(); })
                    .then(function(data) {
                        showLog("Completion response: " + JSON.stringify(data));
                    })
                    .catch(function(err) {
                        showLog("Completion fetch error: " + err.message);
                    });
                },
                onCancel: function(paymentId) {
                    showLog("Payment cancelled: " + paymentId);
                },
                onError: function(error, payment) {
                    showLog("Payment error: " + (error.message || JSON.stringify(error)));
                }
            });
        }
    </script>
</body>
</html>
