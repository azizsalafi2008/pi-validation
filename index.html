<script>
    // Initialize Pi SDK (Ensure sandbox mode matches developer.pi settings)
    Pi.init({ version: "2.0", sandbox: true });

    // Authenticate user on load
    Pi.authenticate(['username', 'payments'], function(payment) {
        showLog("Incomplete payment detected: " + payment.identifier);
    }).then(function(auth) {
        showLog("Connected as: " + auth.user.username);
    }).catch(function(error) {
        showLog("Auth error: " + error.message);
    });

    function showLog(msg) {
        var statusDiv = document.getElementById("status");
        if (statusDiv) {
            statusDiv.innerText = msg;
        }
        console.log(msg);
    }

    function makePayment() {
        showLog("Creating payment...");

        Pi.createPayment({
            amount: 1,
            memo: "DocHelper Test Payment",
            metadata: { orderId: 1234 }
        }, {
            onReadyForServerApproval: function(paymentId) {
                showLog("Approving payment ID: " + paymentId);
                
                // Crucial 'return' keyword passes the promise to the Pi SDK
                return fetch('/api/approve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ paymentId: paymentId })
                })
                .then(function(res) {
                    return res.json();
                })
                .then(function(data) {
                    showLog("Approve response: " + JSON.stringify(data));
                })
                .catch(function(err) {
                    showLog("Approval fetch error: " + err.message);
                });
            },
            onReadyForServerCompletion: function(paymentId, txid) {
                showLog("Completing payment ID: " + paymentId);
                
                return fetch('/api/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ paymentId: paymentId, txid: txid })
                })
                .then(function(res) {
                    return res.json();
                })
                .then(function(data) {
                    showLog("Completion response: " + JSON.stringify(data));
                })
                .catch(function(err) {
                    showLog("Completion fetch error: " + err.message);
                });
            },
            onCancel: function(paymentId) {
                showLog("Payment cancelled: " + paymentId);
            },
            onError: function(error, payment) {
                showLog("Payment error: " + (error.message || JSON.stringify(error)));
            }
        });
    }
</script>
